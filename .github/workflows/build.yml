name: Build Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-pc-windows-msvc
            runner: windows-latest
            args: ''
          - platform: aarch64-apple-darwin
            runner: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: x86_64-apple-darwin
            runner: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev

      # `shell: bash` is mandatory: the Windows runner defaults to pwsh,
      # where $(...) would be parsed as PowerShell and yield an empty version.
      - name: Resolve app version
        shell: bash
        run: echo "TAURI_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - name: Build frontend
        run: npm run build

      # All jobs append to the SAME draft release; `publish` flips it once.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ env.TAURI_VERSION }}
          releaseName: "91写作 v${{ env.TAURI_VERSION }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Runs after the desktop matrix so the draft release already exists and
  # the APK can be attached to it. tauri-action mis-detects Android builds
  # and shells out to a desktop `tauri build`, so we drive the CLI directly.
  build-android:
    runs-on: ubuntu-22.04
    needs: build-desktop
    if: always() && needs.build-desktop.result != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships cmdline-tools/7.0, which is too old to
      # resolve the `tools` package and breaks every sdkmanager call.
      - name: Setup Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          TOOLS_VERSION="11076708"   # cmdline-tools 12.0
          rm -rf "$SDK_ROOT/cmdline-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${TOOLS_VERSION}_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
          mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked
          rustup target add aarch64-linux-android

      # gen/android is gitignored, so it must be generated on CI.
      - name: Init Android project
        run: npx tauri android init

      # Release signing is optional: with the secrets present we build a
      # signed release, otherwise we fall back to a debug-signed APK.
      - name: Configure Android signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEY_BASE64:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            cd src-tauri/gen/android
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS" > keystore.properties
            printf 'password=%s\n' "$ANDROID_KEY_PASSWORD" >> keystore.properties
            printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/keystore.jks" >> keystore.properties
            echo "ANDROID_BUILD_MODE=release" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "ANDROID_BUILD_MODE=debug" >> "$GITHUB_ENV"
            echo "No Android keystore secrets found; building debug-signed APK."
          fi

      - name: Resolve app version
        run: echo "TAURI_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Android app
        shell: bash
        run: |
          set -euo pipefail
          mode_flag=""
          if [ "${ANDROID_BUILD_MODE}" = "debug" ]; then
            mode_flag="--debug"
          fi
          npx tauri android build --target aarch64 $mode_flag

      - name: Upload APK to the draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ env.TAURI_VERSION }}
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | sort | head -1)
          if [ -z "$apk" ]; then
            echo "No APK produced."; exit 1
          fi
          echo "Uploading $apk to $TAG"
          gh release upload "$TAG" "$apk#Android APK" --clobber

  # Publishes the draft release exactly once, after every build settles.
  publish:
    runs-on: ubuntu-22.04
    needs: [build-desktop, build-android]
    if: always() && !cancelled()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          tag="v${version}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            echo "Release ${tag} does not exist; nothing to publish."
            exit 0
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "Release ${tag} is already published."
            exit 0
          fi
          echo "Publishing draft release ${tag}"
          gh release edit "$tag" --draft=false